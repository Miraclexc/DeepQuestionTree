llm:
  generation_model: deepseek-flash
  decision_model: deepseek-flash
  base_url: https://api.deepseek.com
  enable_thinking_controls: true
  generation_thinking: false
  decision_thinking: true
  generation_reasoning_effort: high
  decision_reasoning_effort: high
  timeout: 120
  max_retries: 0
mcts:
  max_depth: 10
  branch_factor: 5
  max_simulations: 20
  exploration_constant: 1.414
  parallel_workers: 1
checker:
  question_history_window: 50
  literal_normalization: true
  fail_open: true
