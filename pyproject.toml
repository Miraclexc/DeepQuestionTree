[project]
name = "deep-question-tree"
version = "0.1.0"
description = "Reproducible MCTS agent research with decoupled execution, evaluation and reporting"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic==2.12.5",
    "openai==2.30.0",
    "tenacity==9.1.4",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.2",
    "Jinja2==3.1.6",
    "colorlog==6.10.1",
    "numpy>=2",
    "catalogue>=2.0.10",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "black==25.11.0",
    "isort==7.0.0",
    "mypy==1.19.0",
    "types-pyyaml>=6.0.12.20250915",
]

[project.scripts]
paper = "framework.runtime.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["framework*", "workflows*", "project*"]
namespaces = false

[tool.setuptools.package-dir]
framework = "src/framework"
workflows = "src/workflows"
project = "src/project"

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '(src/framework/|src/workflows/|tests/integration/template/)'

[tool.isort]
profile = "black"
py_version = 312
src_paths = ["src", "tests"]
skip_glob = ["src/framework/*", "src/workflows/*", "tests/integration/template/*"]

[tool.mypy]
python_version = "3.12"
packages = ["project.dqt"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "openai",
]
ignore_missing_imports = true
